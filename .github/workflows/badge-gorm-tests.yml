name: Badge GORM tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GORM-tests"]
    branches: [master]
    types: [completed]
  
jobs:
  create-gorm-tests-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: gorm-tests.yml
          workflow_conclusion: completed
          path: .
      
      - name: Prepare badge data
        run: |
          artifact_dir="$(find . -maxdepth 1 -type d -name 'Linux-*-tests.out' -print | sort -V | tail -n 1)"
          if [ -z "$artifact_dir" ]; then
            echo "No Linux GORM test artifact found" >&2
            exit 1
          fi

          echo "Using $artifact_dir"
          echo "tests_passed=$(awk '/PASS/{count++} END{print count+0}' "$artifact_dir"/*.out)" >> "$GITHUB_ENV"
          echo "tests_skipped=$(awk '/SKIP/{count++} END{print count+0}' "$artifact_dir"/*.out)" >> "$GITHUB_ENV"
          echo "tests_failed=$(awk '/FAIL/{count++} END{print count+0}' "$artifact_dir"/*.out)" >> "$GITHUB_ENV"
      
      - name: Make success badge 
        if: ${{ env.tests_failed == '0' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: fb4d23f63d866b3e1e58b26d2f5ed01f
          filename: badge-gorm-tests.json
          label: GORM tests
          message: "Passed: ${{ env.tests_passed }} | Failed: ${{ env.tests_failed }}"
          color: 54a158
          style: for-the-badge
          labelColor: 25292d
          
      - name: Make fail badge
        if: ${{ env.tests_failed != '0' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: fb4d23f63d866b3e1e58b26d2f5ed01f
          filename: badge-gorm-tests.json
          label: GORM tests
          message: "Passed: ${{ env.tests_passed }} | Failed: ${{ env.tests_failed }}"
          color: 96232b
          style: for-the-badge
          labelColor: 25292d
